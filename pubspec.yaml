name: myfinances
description: A finances control app.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.2
  shared_preferences: ^2.1.2
  get: ^4.6.5
  flutter_animate: ^4.2.0
  credentials_manager: ^1.0.3
  localization: ^2.1.0
  firebase_core: ^2.14.0
  cloud_firestore: ^4.8.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - lib/i18n/

flutter_launcher_icons:
  android: true
  image_path_android: "assets/icons/android-icon.png"
  adaptive_icon_foreground: "assets/icons/android-adaptive-icon.png"
  adaptive_icon_background: "assets/icons/android-adaptive-icon-background.png"
  ios: true
  image_path_ios: "assets/icons/ios-icon.png"
  remove_alpha_ios: true
