name: myfinances
description: A finances control app.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+51

environment:
  sdk: '>=3.0.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  get: ^4.6.6
  flutter_animate: ^4.3.0
  credentials_manager: ^1.0.3
  localization: ^2.1.1
  firebase_core: ^2.24.1
  cloud_firestore: ^4.13.4
  crypto: ^3.0.3
  intl: ^0.18.1
  equatable: ^2.0.5
  image_picker: ^1.0.4
  image_cropper: ^5.0.1
  firebase_storage: ^11.5.4
  package_info_plus: ^5.0.1
  google_fonts: ^6.1.0
  calendar_date_picker2: ^0.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^2.0.0
  flutter_native_splash: ^2.3.2
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - lib/src/core/i18n/

flutter_launcher_icons:
  ios: true
  android: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/icon.png"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  image: "assets/images/logo.png"
  image_dark: "assets/images/logo.png"
